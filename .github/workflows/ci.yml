name: Backend CI

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop


jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: team_task_tracker
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d team_task_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 5s


    steps:
      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      # ======================================================
      # DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ======================================================
      # ENVIRONMENT
      # ======================================================

      - name: Configure test environment
        run: |
          echo "SECRET_KEY=test-secret-key-for-ci" >> $GITHUB_ENV
          echo "DEBUG=True" >> $GITHUB_ENV
          echo "ALLOWED_HOSTS=localhost,127.0.0.1" >> $GITHUB_ENV
          echo "DB_NAME=team_task_tracker" >> $GITHUB_ENV
          echo "DB_USER=postgres" >> $GITHUB_ENV
          echo "DB_PASSWORD=postgres" >> $GITHUB_ENV
          echo "DB_HOST=127.0.0.1" >> $GITHUB_ENV
          echo "DB_PORT=5432" >> $GITHUB_ENV
          echo "CORS_ALLOWED_ORIGINS=http://localhost:3000" >> $GITHUB_ENV


      # ======================================================
      # DATABASE / MIGRATIONS
      # ======================================================

      - name: Check for missing migrations
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run migrations
        run: |
          python manage.py migrate


      # ======================================================
      # DJANGO CHECK
      # ======================================================

      - name: Django system check
        run: |
          python manage.py check


      # ======================================================
      # TESTS
      # ======================================================

      - name: Run tests
        run: |
          pytest